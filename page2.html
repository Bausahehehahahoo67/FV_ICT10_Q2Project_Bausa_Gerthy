<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Non-Metal Element Database</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <style>
        .info-box {
            text-align: left;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 2px solid rgba(17, 20, 193, 0.2);
        }
    </style>
</head>
<body>
    <nav class="site-nav">
        <div class="site-nav-inner">
            <a class="navbar-brand" href="index.html">
                The Bradarian Collective Club
                <img src="https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/i/5dd0922b-11ae-4ea0-b1e6-193e9471bdb4/d4lfdge-55c29181-a986-42cf-b822-eebfde5b2010.jpg" id="logo" alt="Logo">
            </a>
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="index.html">Home Page</a></li>
                <li class="nav-item"><a class="nav-link" href="page1.html">Club Leaders and Members</a></li>
                <li class="nav-item"><a class="nav-link active-page" href="page2.html" aria-current="page">Non-Metal Element Database</a></li>
                <li class="nav-item"><a class="nav-link" href="page3.html">Meet the Creator</a></li>
            </ul>
        </div>
    </nav>
    <main class="page-content">
        <div class="form-container">
            <h1>Non-Metal Elements</h1>
            <form class="element-form">
                <label for="nonmets">Please Enter Element Name</label>
                <input type="text" id="nonmets" placeholder="E.G: Xenon, Argon">
                <button type="button" py-click="locate_element">Find Element</button>
            </form>

            <div id="element-result" aria-live="polite"></div>

            <div class="info-box">
                <h3>Information Database</h3>
                <p><b>Symbol:</b> <span id="data_symbol"></span></p>
                <p><b>Proper Name:</b> <span id="data_name"></span></p>
                <p><b>Atomic Number:</b> <span id="data_number"></span></p>
                <p><b>Atomic Weight:</b> <span id="data_weight"></span></p>
            </div>
        </div>
    </main>

    <script type="py" src="main.py"></script>
</body>
</html>
